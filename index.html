<!doctype html>
<html lang="es">
  <head>
    <meta name="traction-app" content="community" />
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let theme = "light";
        try {
          if (localStorage.getItem("traction_theme") === "dark") theme = "dark";
        } catch {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <title>Comunidad del Intercambio | Plataforma de Formación & Negocios</title>
    <meta name="description" content="Comunidad del Intercambio - Plataforma de formación ejecutiva, cursos prácticos, clases en vivo y red de alto impacto." />
    <!-- Corporate typeface: Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
